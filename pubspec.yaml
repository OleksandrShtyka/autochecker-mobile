name: autochecker_mobile
description: "GYM Tracker — your personal fitness companion app."
publish_to: 'none'

version: 3.2.3+17

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  open_filex: ^4.3.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.0
  workmanager: ^0.9.0
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  webview_flutter: ^4.10.0
  health: ^12.0.0
  flutter_blue_plus: ^2.2.1
  url_launcher: ^6.3.1
  audioplayers: ^6.0.0
  google_sign_in: ^6.2.2
  flutter_tts: ^4.2.0
  camera: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/icon.png"
